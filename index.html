<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>NQAS Portal</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<style>
:root{--bg:#f6f8fc;--fg:#1f1f1f;--card:#fff;--ac:#0b57d0;--bd:#dadce0;--mut:#5f6368;--tint:#eaf1fb;--sel:#d3e3fd;--sh:0 1px 2px rgba(60,64,67,.3),0 1px 3px 1px rgba(60,64,67,.15);--sh2:0 4px 8px 3px rgba(60,64,67,.15),0 1px 3px rgba(60,64,67,.3)}
*{box-sizing:border-box}body{margin:0;font:14px/1.45 "Google Sans",Roboto,"Segoe UI",Arial,sans-serif;background:var(--bg);color:var(--fg)}
header{display:flex;align-items:center;gap:10px;height:60px;padding:0 16px}header b{font-size:20px;font-weight:400;color:#444746}header .sp{flex:1}.search{flex:1;max-width:640px;margin-left:24px}.search input{width:100%;border:0;border-radius:24px;background:#eaf1fb;padding:11px 20px;font-size:15px}.search input:focus{background:#fff;box-shadow:var(--sh2);outline:0}
.logo{width:34px;height:34px;border-radius:10px;background:var(--ac);color:#fff;display:grid;place-items:center;font-weight:600;box-shadow:var(--sh)}
.chip{background:var(--card);border-radius:20px;padding:6px 14px;box-shadow:var(--sh);color:var(--mut);font-size:13px}
#shell{display:flex;align-items:flex-start}nav{width:232px;padding:4px 8px 8px 0;display:flex;flex-direction:column;gap:2px;flex-shrink:0}
nav button.nv{background:none;color:#444746;text-align:left;border-radius:0 20px 20px 0;padding:9px 18px;height:40px;font-size:14px;box-shadow:none}
nav button.nv:hover{background:#e9eef6}nav button.nv.on{background:var(--sel);color:#041e49;font-weight:600}
main{flex:1;min-width:0;background:var(--card);border-radius:16px;margin:0 16px 16px 0;padding:16px;min-height:calc(100vh - 76px);box-shadow:var(--sh)}
button{background:var(--ac);color:#fff;border:0;border-radius:20px;padding:7px 18px;cursor:pointer;font:inherit;font-weight:500;transition:box-shadow .15s,background .15s}
button:hover{box-shadow:var(--sh)}button.g{background:transparent;color:var(--ac);border:1px solid var(--bd)}button.g:hover{background:var(--tint)}
input,select,textarea{font:inherit;padding:6px 9px;border:1px solid var(--bd);border-radius:8px;background:#fff;color:var(--fg);max-width:100%}
input:focus,select:focus,textarea:focus{outline:2px solid var(--ac);outline-offset:-1px;border-color:var(--ac)}textarea{width:100%}
.card{background:var(--card);border-radius:12px;padding:14px;margin-bottom:14px;box-shadow:var(--sh)}h3{margin:0 0 10px;font-weight:500;font-size:18px}
table{border-collapse:collapse;width:100%}th,td{border-bottom:1px solid #e8eaed;padding:7px 9px;text-align:left;vertical-align:top}th{background:var(--bg);color:#444746;font-weight:500;position:sticky;top:0}
.wrap{overflow-x:auto}.sm{font-size:12px;color:var(--mut)}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
tr.click{cursor:pointer}tr.click:hover{background:#f2f6fc;box-shadow:inset 3px 0 var(--ac)}.tag{padding:2px 10px;border-radius:12px;background:var(--tint);color:#0842a0;font-size:12px}.bad{color:#d93025;font-weight:600}
#modal{position:fixed;inset:0;background:#0006;display:none;overflow:auto;padding:24px}#modal>div{max-width:900px;margin:auto;background:var(--card);border-radius:16px;padding:20px;box-shadow:var(--sh2)}
.ph{display:none}.sig{display:none}
html{-webkit-text-size-adjust:100%}body{overflow-x:hidden;-webkit-tap-highlight-color:transparent}
/* Material sidebar */
.ph.show{display:block}.pw{white-space:pre-wrap}
nav{width:232px;transition:width .2s;position:sticky;top:0;max-height:100vh;overflow:hidden auto}
nav button.nv{display:flex;align-items:center;gap:14px;white-space:nowrap}
nav svg{width:22px;height:22px;fill:currentColor;flex-shrink:0}
.nsep{font-size:11px;color:var(--mut);padding:12px 18px 2px;text-transform:uppercase;letter-spacing:.6px;white-space:nowrap}
body.nc nav{width:72px}body.nc nav button.nv{padding:9px 25px}body.nc .nl,body.nc .nsep{display:none}
#mb{background:none;color:#444746;padding:8px;border-radius:50%;min-height:0;border:0;display:grid;place-items:center}#mb:hover{background:#e9eef6}#mb svg{width:24px;height:24px;fill:currentColor}
@media(max-width:760px){
body{font-size:14px}
header{height:auto;flex-wrap:wrap;gap:8px;padding:10px 12px;position:sticky;top:0;z-index:20;background:var(--bg)}
header b{font-size:18px;white-space:nowrap}
header .sp{flex:1}
.search{order:5;flex:1 1 100%;max-width:none;margin:0}
.chip{max-width:46vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:5px 10px;font-size:12px}
#shell{flex-direction:column;width:100%}
nav{width:100%;flex-direction:row;overflow-x:auto;padding:0 8px 8px;gap:6px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav button.nv{border-radius:20px;white-space:nowrap;flex-shrink:0;background:var(--card);box-shadow:var(--sh);padding:8px 16px}
nav button.nv.on{background:var(--sel)}
main{margin:0 8px 12px;width:calc(100% - 16px);padding:12px;border-radius:14px;min-height:calc(100vh - 150px)}
.card{padding:12px}
h3{font-size:16px}
/* 16px inputs stop iOS from zooming on focus; bigger tap targets */
input,select,textarea{font-size:16px;padding:9px 10px;min-height:42px}
button{padding:10px 16px;min-height:42px}
.row{gap:8px}
.row>input,.row>select,.row>button{flex:1 1 140px;min-width:0}
.row>input[type=date]{flex:1 1 150px}
input[size]{width:100%}
textarea{min-height:80px}
/* wide tables scroll sideways inside their card instead of breaking the page */
table{display:block;max-width:100%;overflow-x:auto;-webkit-overflow-scrolling:touch}
th,td{padding:8px 8px;min-width:84px;font-size:13px}
td input,td select{min-width:110px}
.card.wrap{overflow-x:auto}
#modal{padding:8px}
#modal>div{padding:14px;border-radius:12px;max-width:100%}
.card[style*="max-width:340px"]{margin:24px auto!important}
}
@media(max-width:760px){#mb,.nsep{display:none}nav,body.nc nav{width:100%;position:static;max-height:none;overflow:auto hidden}body.nc nav button.nv{padding:8px 16px}body.nc .nl{display:inline}nav button.nv{gap:8px}}
@media(max-width:380px){.chip{display:none}header b{font-size:16px}}
@media print{header,nav,.np,#modal button,.row{display:none!important}body{background:#fff;color:#000;font-size:11px}.ph,.sig{display:block}#shell{display:block}main{margin:0;padding:0;box-shadow:none;border-radius:0}
.card{box-shadow:none;padding:0}th{background:#eee!important;color:#000;position:static}td,th{border:1px solid #999}input,select{border:0;background:none;color:#000;appearance:none;padding:0}
body.pm main{display:none}body.pm #modal{display:block!important;position:static;background:none;padding:0}body.pm #modal>div{max-width:none;padding:0;box-shadow:none}
.sig{display:flex!important;justify-content:space-between;margin-top:50px}.sig div{border-top:1px solid #000;width:30%;text-align:center;padding-top:4px}
.ph{text-align:center;margin-bottom:8px}.ph h2,.ph h3{margin:2px}tr{break-inside:avoid}}
</style></head><body>
<header id="hd" class="np"></header><div id="shell"><nav id="nav" class="np"></nav><main id="main"></main></div><div id="modal" onclick="if(event.target==this)cm()"><div id="mbox"></div></div>
<script>
const CFG={url:'https://tppukdafjwvvwkfeiilb.supabase.co',key:'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRwcHVrZGFmand2dndrZmVpaWxiIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTMwODA2MjAsImV4cCI6MjEwODY1NjYyMH0.97gn3RkL7HzvUXTAyD6K5UME38Pfl-3-cEoYW6Y1JGs',hospital:'Chandannagar Sub-Divisional Hospital'};
const sb=supabase.createClient(CFG.url,CFG.key);
try{if(localStorage.nc)document.body.classList.add('nc')}catch(e){}
const STAGES=['Gap Identified','Planned','Corrected','Implemented','Monitored','Reviewed','Re-assessed','Improved'];
const ATYPES=['Internal','District','State','National','Surveillance'];
let me,depts=[],A={q:''},qt;
const $=i=>document.getElementById(i);
const h=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const today=()=>new Date().toISOString().slice(0,10);
const fd=d=>d?d.split('-').reverse().join('/'):'';
const dn=id=>depts.find(d=>d.id==id)?.name||'';
const mine=()=>depts.filter(d=>d.active&&(me.role=='core'||me.dept_ids.includes(d.id)));
const opts=(a,sel)=>a.map(x=>`<option ${x==sel?'selected':''}>${h(x)}</option>`).join('');
const dopts=(sel,all)=>(all?'<option value="">All departments</option>':'')+mine().map(d=>`<option value="${d.id}" ${d.id==sel?'selected':''}>${h(d.name)}</option>`).join('');
const pct=(g,s)=>s?Math.round(g/(2*s)*1000)/10+'%':'–';
async function all(q){let o=[],f=0;for(;;){const{data,error}=await q().range(f,f+999);if(error)throw error;o=o.concat(data);if(data.length<1000)return o;f+=1000}}
const ph=(t,sub)=>`<div class="ph"><h2>${h(CFG.hospital)}</h2><h3>National Quality Assurance Standards – ${h(t)}</h3><div>${sub||''} | Printed on ${fd(today())}</div></div>`;
const sig=()=>`<div class="sig"><div>Prepared by (Dept. Nodal)</div><div>Verified by (NQAS Nodal Officer)</div><div>Core Committee</div></div>`;
function cm(){$('modal').style.display='none'}
function pm(){document.body.classList.add('pm');print();document.body.classList.remove('pm')}

async function boot(){
  const{data:{session}}=await sb.auth.getSession();
  if(!session)return login();
  const{data:p}=await sb.from('profiles').select('*').eq('id',session.user.id).single();me=p;
  if(!me||me.role=='pending'){$('nav').innerHTML='';$('main').innerHTML='<div class="card">Your account is created but not yet activated. Ask the Core Committee to assign your role and department.<br><br><button onclick="logout()">Logout</button></div>';return}
  depts=(await sb.from('departments').select('*').order('name')).data||[];
  const t=NAVS.slice();if(me.role=='core')t.push('Settings',['admin','Admin']);
  $('nav').innerHTML=t.map(x=>typeof x=='string'?`<div class="nsep">${x}</div>`:`<button class="nv" id="n_${x[0]}" title="${x[1]}" onclick="go('${x[0]}')"><svg viewBox="0 0 24 24"><path d="${IC[x[0]]}"/></svg><span class="nl">${x[1]}</span></button>`).join('');
  $('hd').innerHTML=`<button id="mb" title="Expand / minimize menu" onclick="tg()"><svg viewBox="0 0 24 24"><path d="M3 18h18v-2H3v2zm0-5h18v-2H3v2zm0-7v2h18V6H3z"/></svg></button><span class="logo">N</span><b>NQAS Portal</b><div class="search"><input id="q" type="search" placeholder="Search gaps by ref, text, owner, stage, department…" oninput="sq()"></div><span class="sp"></span><span class="chip">${h(me.full_name||me.email)} · ${{core:'Core Committee',nodal:'Dept. Nodal',deo:'Data Entry'}[me.role]}</span><button class="g" onclick="logout()">Logout</button>`;
  go('dash');
}
function login(){$('nav').innerHTML='';$('hd').innerHTML='<span class="logo">N</span><b>NQAS Portal</b>';$('main').innerHTML=`<div class="card" style="max-width:340px;margin:60px auto;box-shadow:var(--sh2)"><h3>NQAS Portal – Login</h3><p class="sm">Authorised users only.</p><p><input id="em" type="email" placeholder="Email" style="width:100%"></p><p><input id="pw" type="password" placeholder="Password" style="width:100%"></p><button onclick="doLogin()">Login</button> <span id="le" class="bad"></span></div>`}
async function doLogin(){const{error}=await sb.auth.signInWithPassword({email:$('em').value,password:$('pw').value});if(error)$('le').textContent=error.message;else boot()}
async function logout(){await sb.auth.signOut();location.reload()}
function go(v){document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.id=='n_'+v));({dash,assess,gaps,rep,admin,mem,mtg,res,out}[v])().catch(e=>$('main').innerHTML='<div class="card bad">'+h(e.message)+'</div>')}

/* ---------- Dashboard ---------- */
async function dash(){
  const[S,AR,G]=await Promise.all([all(()=>sb.from('assessment_summary').select('*').order('assess_date',{ascending:false}).order('id')),all(()=>sb.from('assessment_area_summary').select('*').order('assessment_id').order('area')),all(()=>sb.from('gaps').select('dept_id,stage,target_date').order('id'))]);
  const lat={};S.forEach(a=>{if(!lat[a.dept_id])lat[a.dept_id]=a});
  const rows=mine().map(d=>{const a=lat[d.id],g=G.filter(x=>x.dept_id==d.id&&x.stage!='Improved'),od=g.filter(x=>x.target_date&&x.target_date<today()).length;
    const ar=l=>{const r=a&&AR.find(x=>x.assessment_id==a.id&&x.area[0]==l);return r?pct(r.got,r.scored):'–'};
    return`<tr><td>${h(d.name)}</td><td>${a?fd(a.assess_date)+' <span class="tag">'+h(a.atype)+(a.status=='draft'?' · draft':'')+'</span>':'–'}</td><td>${a?a.scored:0}</td><td><b>${a?pct(a.got,a.scored):'–'}</b></td><td>${ar('G')}</td><td>${ar('H')}</td><td>${g.length}</td><td class="${od?'bad':''}">${od}</td></tr>`}).join('');
  $('main').innerHTML=`<div class="card wrap"><h3>Department status (latest assessment)</h3><table><tr><th>Department</th><th>Last assessment</th><th>Items scored</th><th>Score</th><th>G – Quality Mgmt</th><th>H – Outcome</th><th>Open gaps</th><th>Overdue</th></tr>${rows}</table><p class="sm">Score = marks obtained ÷ maximum for items scored so far (2 = full, 1 = partial, 0 = non-compliant).</p></div>
  <div class="card"><h3>Cycle</h3>Assess → Identify Gap → Plan → Correct → Implement → Monitor → Review → Re-assess → Improve. Each step is recorded with a date in <b>Gaps & Actions</b> and can be printed from <b>Reports</b>.</div>`;
}

/* ---------- Assessment ---------- */
async function assess(d){
  A.dept=d||A.dept||mine()[0]?.id;A.cur=null;
  const L=await all(()=>sb.from('assessment_summary').select('*').eq('dept_id',A.dept).order('assess_date',{ascending:false}).order('id'));
  $('main').innerHTML=`<div class="card"><div class="row"><select onchange="assess(this.value)">${dopts(A.dept)}</select></div>
  <div class="row"><b>New assessment:</b><input type="date" id="nd" value="${today()}"><select id="nt">${opts(ATYPES)}</select><input id="na" placeholder="Assessor name(s)" size="30"><button onclick="newA()">Create</button></div>
  <table><tr><th>Date</th><th>Type</th><th>Assessors</th><th>Status</th><th>Scored</th><th>Score</th></tr>${L.map(a=>`<tr class="click" onclick="openA('${a.id}')"><td>${fd(a.assess_date)}</td><td>${h(a.atype)}</td><td></td><td>${a.status}</td><td>${a.scored}</td><td>${pct(a.got,a.scored)}</td></tr>`).join('')}</table></div><div id="ae"></div>`;
}
async function newA(){const{data,error}=await sb.from('assessments').insert({dept_id:A.dept,assess_date:$('nd').value,atype:$('nt').value,assessors:$('na').value}).select().single();if(error)return alert(error.message);A.cur=data;loadA()}
async function openA(id){const{data}=await sb.from('assessments').select('*').eq('id',id).single();A.cur=data;loadA()}
async function loadA(){
  $('ae').innerHTML='<div class="card">Loading checklist…</div>';
  A.cps=await all(()=>sb.from('checkpoints').select('*').eq('dept_id',A.cur.dept_id).order('sheet').order('seq'));
  A.sc={};(await all(()=>sb.from('scores').select('*').eq('assessment_id',A.cur.id).order('checkpoint_id'))).forEach(s=>A.sc[s.checkpoint_id]=s);
  A.sheet=[...new Set(A.cps.map(c=>c.sheet))][0];A.area=null;drawA();
}
function drawA(){
  const sheets=[...new Set(A.cps.map(c=>c.sheet))],areas=[...new Set(A.cps.filter(c=>c.sheet==A.sheet).map(c=>c.area))];
  A.area=areas.includes(A.area)?A.area:areas[0];
  const ro=A.cur.status=='final'&&me.role=='deo'||A.cur.status=='final'&&0,rows=A.cps.filter(c=>c.sheet==A.sheet&&c.area==A.area);
  const done=Object.values(A.sc).filter(s=>s.score!==null).length;
  let lastStd='';
  $('ae').innerHTML=`<div class="card"><div class="row"><b>${h(dn(A.cur.dept_id))} – ${fd(A.cur.assess_date)} (${h(A.cur.atype)}) · ${A.cur.status}</b><span class="sm">${done} of ${A.cps.length} items scored</span></div>
  <div class="row"><select onchange="A.sheet=this.value;A.area=null;drawA()">${sheets.map(s=>`<option ${s==A.sheet?'selected':''}>${h(s)}</option>`).join('')}</select>
  <select onchange="A.area=this.value;drawA()">${opts(areas,A.area)}</select>
  <button class="g" onclick="print()">Print this section</button>
  ${A.cur.status=='draft'&&me.role!='deo'?'<button onclick="finA()">Finalize</button>':''}<button onclick="genGaps()">Generate gaps (score &lt; 2)</button></div>
  ${ph('Assessment Sheet: '+h(A.sheet)+' / Area '+h(A.area),h(dn(A.cur.dept_id))+' | Date of assessment '+fd(A.cur.assess_date)+' | '+h(A.cur.atype)+' | Assessors: '+h(A.cur.assessors))}
  <div class="wrap"><table><tr><th>Ref</th><th>Checkpoint / Means of verification</th><th>Method</th><th>Score</th><th>Remarks</th></tr>${rows.map(c=>{const s=A.sc[c.id]||{};
    const hd=c.standard!=lastStd?(lastStd=c.standard,`<tr><td colspan="5"><b>${h(c.standard)}</b></td></tr>`):'';
    return hd+`<tr><td>${h(c.me_ref)}</td><td>${h(c.checkpoint)}<div class="sm">${h(c.mov)}</div></td><td>${h(c.method)}</td><td><select onchange="sv(${c.id},this.closest('tr'))" ${A.cur.status=='final'?'disabled':''}><option value="">–</option>${[0,1,2].map(n=>`<option ${s.score===n?'selected':''}>${n}</option>`).join('')}</select></td><td><input value="${h(s.remarks)}" ${A.cur.status=='final'?'disabled':''} onchange="sv(${c.id},this.closest('tr'))"></td></tr>`}).join('')}</table></div>${sig()}</div>`;
}
async function sv(id,tr){const v=tr.querySelector('select').value,r=tr.querySelector('input').value,sc=v===''?null:+v;
  const{error}=await sb.from('scores').upsert({assessment_id:A.cur.id,checkpoint_id:id,score:sc,remarks:r,updated_at:new Date().toISOString()});
  tr.style.background=error?'#fdd':'#dfd';if(error)alert(error.message);else A.sc[id]={score:sc,remarks:r}}
async function finA(){if(!confirm('Finalize? Scores will be locked.'))return;const{error}=await sb.from('assessments').update({status:'final'}).eq('id',A.cur.id);if(error)return alert(error.message);A.cur.status='final';drawA()}
async function genGaps(){
  const low=Object.values(A.sc).filter(s=>s.score!==null&&s.score<2).map(s=>s.checkpoint_id);
  const ex=await all(()=>sb.from('gaps').select('checkpoint_id').eq('dept_id',A.cur.dept_id).neq('stage','Improved').order('id'));const have=new Set(ex.map(e=>e.checkpoint_id));
  const rows=low.filter(k=>!have.has(k)).map(k=>({dept_id:A.cur.dept_id,checkpoint_id:k,assessment_id:A.cur.id,description:A.cps.find(c=>c.id==k).checkpoint,identified_on:A.cur.assess_date}));
  for(let i=0;i<rows.length;i+=300){const{error}=await sb.from('gaps').insert(rows.slice(i,i+300));if(error)return alert(error.message)}
  alert(rows.length+' new gap(s) created; '+(low.length-rows.length)+' already open.')}

/* ---------- Gaps ---------- */
async function gaps(){
  A.g=await all(()=>sb.from('gaps').select('*,checkpoints(me_ref,checkpoint,area,standard,mov)').order('identified_on',{ascending:false}).order('id'));
  $('main').innerHTML=`<div class="card"><div class="row"><select id="gd" onchange="gl()">${dopts('',1)}</select><select id="gs" onchange="gl()"><option value="">All stages</option>${opts(STAGES)}</select><select id="ga" onchange="gl()"><option value="">All areas</option>${'ABCDEFGH'.split('').map(x=>`<option>${x}</option>`).join('')}</select></div><div class="wrap" id="gt"></div></div>`;gl()}
function sq(){clearTimeout(qt);qt=setTimeout(()=>{A.q=$('q').value.trim().toLowerCase();if($('gt'))gl();else if(A.q)go('gaps')},250)}
function gl(){const d=$('gd').value,s=$('gs').value,a=$('ga').value,w=(A.q||'').split(/\s+/).filter(Boolean);
  const L=A.g.filter(g=>(!d||g.dept_id==d)&&(!s||g.stage==s)&&(!a||g.checkpoints?.area?.[0]==a)&&(!w.length||w.every(x=>[g.checkpoints?.me_ref,g.checkpoints?.standard,g.description,g.root_cause,g.owner,g.stage,g.priority,dn(g.dept_id)].join(' ').toLowerCase().includes(x))));
  $('gt').innerHTML=`<table><tr><th>Ref</th><th>Gap</th><th>Dept</th><th>Stage</th><th>Priority</th><th>Identified</th><th>Target</th></tr>${L.map(g=>`<tr class="click" onclick="openGap('${g.id}')"><td>${h(g.checkpoints?.me_ref)}</td><td>${h(g.description)}</td><td>${h(dn(g.dept_id))}</td><td><span class="tag">${h(g.stage)}</span></td><td>${h(g.priority)}</td><td>${fd(g.identified_on)}</td><td class="${g.target_date&&g.target_date<today()&&g.stage!='Improved'?'bad':''}">${fd(g.target_date)}</td></tr>`).join('')}</table><p class="sm">${L.length} record(s)${A.q?' matching “'+h(A.q)+'”':''}</p>`}
async function openGap(id){
  const g=A.g.find(x=>x.id==id),ac=await all(()=>sb.from('activities').select('*').eq('gap_id',id).order('act_date').order('created_at'));A.gid=id;
  $('mbox').innerHTML=`<div class="row np"><button onclick="pm()">Print record</button><button class="g" onclick="cm()">Close</button></div>
  ${ph('Gap & Corrective Action Record',h(dn(g.dept_id)))}
  <p><b>${h(g.checkpoints?.me_ref)}</b> · ${h(g.checkpoints?.standard)}<br>${h(g.description)}<br><span class="sm">${h(g.checkpoints?.mov)}</span></p>
  <div class="row">Identified on <b>${fd(g.identified_on)}</b> · Stage <span class="tag">${h(g.stage)}</span></div>
  <div class="row">Priority <select id="gp">${opts(['High','Medium','Low'],g.priority)}</select> Owner <input id="go" value="${h(g.owner)}"> Target date <input type="date" id="gt2" value="${g.target_date||''}"> <button class="np" onclick="saveGap()">Save</button></div>
  <p>Root cause / action plan<textarea id="gr" rows="3">${h(g.root_cause)}</textarea></p>
  <h4>Date-wise activity</h4><table><tr><th>Date</th><th>Stage</th><th>Activity</th><th>By</th><th>Evidence ref.</th></tr>${ac.map(a=>`<tr><td>${fd(a.act_date)}</td><td>${h(a.stage)}</td><td>${h(a.details)}</td><td>${h(a.responsible||a.entered_by_name)}</td><td>${h(a.evidence)}</td></tr>`).join('')||'<tr><td colspan="5" class="sm">No activity recorded yet</td></tr>'}</table>
  <div class="row np" style="margin-top:10px"><input type="date" id="ad" value="${today()}"><select id="as">${opts(STAGES.slice(1),STAGES[STAGES.indexOf(g.stage)+1]||g.stage)}</select><input id="at" placeholder="What was done" size="34"><input id="ab" placeholder="Responsible" size="14"><input id="ae2" placeholder="Evidence (doc/photo ref)" size="18"><button onclick="addAct()">Add entry</button></div><p class="sm np">Entries are permanent (cannot be edited) to preserve the documentation trail.</p>${sig()}`;
  $('modal').style.display='block'}
async function saveGap(){const{error}=await sb.from('gaps').update({priority:$('gp').value,owner:$('go').value,target_date:$('gt2').value||null,root_cause:$('gr').value}).eq('id',A.gid);if(error)return alert(error.message);alert('Saved')}
async function addAct(){const g=A.g.find(x=>x.id==A.gid),st=$('as').value;if(!$('at').value.trim())return alert('Enter details');
  const{error}=await sb.from('activities').insert({gap_id:g.id,dept_id:g.dept_id,stage:st,act_date:$('ad').value,details:$('at').value,responsible:$('ab').value,evidence:$('ae2').value,entered_by_name:me.full_name||me.email});if(error)return alert(error.message);
  await sb.from('gaps').update({stage:st}).eq('id',g.id);g.stage=st;openGap(g.id);gl()}

async function rep(){

async function res(){
  [A.M,A.R]=await Promise.all([all(()=>sb.from('meetings').select('*').order('meeting_date',{ascending:false})),all(()=>sb.from('resolutions').select('meeting_id'))]);
  $('main').innerHTML=`<div class="card wrap"><h3>Meeting resolutions</h3><table><tr><th>Meeting</th><th>Date</th><th>Order No.</th><th>Resolution</th><th></th></tr>${A.M.map(m=>`<tr><td>${h(m.title)}</td><td>${fd(m.meeting_date)}</td><td>${h(m.order_no)}</td><td>${A.R.some(r=>r.meeting_id==m.id)?'<span class="tag">Saved</span>':'–'}</td><td><button class="g" onclick="openRes(${m.id})">${core()?'Prepare / edit':'View'}</button></td></tr>`).join('')||'<tr><td colspan="5" class="sm">Create a meeting order first.</td></tr>'}</table></div><div id="re"></div>`}
const ritem=(it,i)=>`<tr class="ri"><td>${i+1}</td><td><textarea class="ra" rows="2">${h(it.agenda)}</textarea></td><td><textarea class="rd" rows="2">${h(it.discussion)}</textarea></td><td><textarea class="rr" rows="2">${h(it.decision)}</textarea></td><td><select class="rp"><option value="">–</option>${A.inv.map(x=>`<option ${x.name==it.resp?'selected':''}>${h(x.name)}</option>`).join('')}</select></td><td><input type="date" class="rt" value="${it.due||''}"></td></tr>`;
async function openRes(mid){
  const m=A.M.find(x=>x.id==mid);A.rm=m;A.m=await all(()=>sb.from('members').select('*').order('name'));
  const{data:r}=await sb.from('resolutions').select('*').eq('meeting_id',mid).maybeSingle();
  A.inv=A.m.filter(x=>(m.invitees||[]).includes(x.id));
  const items=r?.items?.length?r.items:(m.agenda||[]).map(a=>({agenda:a})),att=r?.attendance||A.inv.map(x=>x.id);
  $('re').innerHTML=`<div class="card"><h3>${h(m.title)} – ${fd(m.meeting_date)}</h3><p><b>Attendance</b></p><div>${A.inv.map(x=>chk('at',x,att.includes(x.id))).join('')}</div>
  <div class="row" style="margin-top:8px">Chaired by <input id="rc" size="32" placeholder="Name & designation" value="${h(r?.chair)}"></div>
  <div class="wrap"><table id="rt2"><tr><th>#</th><th>Agenda</th><th>Discussion</th><th>Resolution / decision</th><th>Responsible</th><th>Target date</th></tr>${items.map(ritem).join('')}</table></div>
  <div class="row" style="margin-top:8px">${core()?'<button onclick="saveRes()">Save</button><button class="g" onclick="addRI()">Add item</button>':''}<button class="g" onclick="resDoc()">Print resolution</button></div></div>`;
  $('re').scrollIntoView()}
function addRI(){$('rt2').insertAdjacentHTML('beforeend',ritem({},$('rt2').rows.length-1))}
function colRes(){const q=(r,c)=>r.querySelector(c).value;return{items:[...document.querySelectorAll('.ri')].map(r=>({agenda:q(r,'.ra'),discussion:q(r,'.rd'),decision:q(r,'.rr'),resp:q(r,'.rp'),due:q(r,'.rt')})),attendance:[...document.querySelectorAll('.at:checked')].map(c=>+c.value),chair:$('rc').value}}
async function saveRes(){const{error}=await sb.from('resolutions').upsert({meeting_id:A.rm.id,...colRes(),updated_at:new Date().toISOString()},{onConflict:'meeting_id'});alert(error?error.message:'Saved')}
function resDoc(){const m=A.rm,c=colRes();
  $('mbox').innerHTML=`<div class="row np"><button onclick="pm()">Print</button><button class="g" onclick="cm()">Close</button></div>
  ${phs('Minutes & Resolution of Meeting',`${h(m.title)} &nbsp;|&nbsp; Order No. ${h(m.order_no)}`)}
  <p>Meeting held on <b>${wd(m.meeting_date)}, ${fd(m.meeting_date)}</b>${m.meeting_time?' at '+t12(m.meeting_time):''} at ${h(m.venue)}. Chaired by <b>${h(c.chair)}</b>.</p>
  <h4>Attendance</h4><table><tr><th>#</th><th>Name</th><th>Designation</th><th>Department</th><th>Present</th><th>Signature</th></tr>${A.inv.map((x,i)=>`<tr><td>${i+1}</td><td>${h(x.name)}</td><td>${h(x.designation)}</td><td>${h(dn(x.dept_id))}</td><td>${c.attendance.includes(x.id)?'Yes':'No'}</td><td></td></tr>`).join('')}</table>
  <h4>Discussion & Resolutions</h4><table><tr><th>#</th><th>Agenda</th><th>Discussion</th><th>Resolution</th><th>Responsible</th><th>By</th></tr>${c.items.map((x,i)=>`<tr><td>${i+1}</td><td class="pw">${h(x.agenda)}</td><td class="pw">${h(x.discussion)}</td><td class="pw">${h(x.decision)}</td><td>${h(x.resp)}</td><td>${fd(x.due)}</td></tr>`).join('')}</table>
  <div style="display:flex;justify-content:space-between;margin-top:50px"><div>Member-Convenor</div><div>Chairperson</div></div>`;
  $('modal').style.display='block'}

/* ===== Outcome (Area H) analysis ===== */
const SEED=[['H1-01','Bed Occupancy Rate','H1 Productivity','Inpatient days','Available bed-days (beds × days)',100,'%','higher'],['H1-02','Bed Turnover Rate','H1 Productivity','Discharges (incl. deaths, LAMA)','Functional beds',1,'per bed','higher'],['H1-03','Referral Rate','H1 Productivity','Patients referred out','Total OPD + admissions',100,'%','lower'],['H2-01','Average Length of Stay','H2 Efficiency','Inpatient days','Discharges (incl. deaths, LAMA)',1,'days','lower'],['H2-02','Average OPD Waiting Time','H2 Efficiency','Total waiting minutes (sample)','Patients sampled',1,'min','lower'],['H3-01','Hospital Acquired Infection Rate','H3 Clinical Care & Safety','HAI cases','Patient days',1000,'per 1000 pt-days','lower'],['H3-02','Surgical Site Infection Rate','H3 Clinical Care & Safety','SSI cases','Surgeries done',100,'%','lower'],['H3-03','Surgical Safety Checklist Adherence','H3 Clinical Care & Safety','Surgeries with checklist','Total surgeries',100,'%','higher'],['H3-04','Hand Hygiene Compliance','H3 Clinical Care & Safety','Compliant opportunities','Opportunities observed',100,'%','higher'],['H3-05','Institutional Mortality Rate','H3 Clinical Care & Safety','Deaths','Admissions',100,'%','lower'],['H4-01','Patient Satisfaction Score','H4 Service Quality','Satisfied responses','Total responses',100,'%','higher']];
async function seedI(){const{error}=await sb.from('outcome_indicators').insert(SEED.map(s=>({code:s[0],name:s[1],standard:s[2],num_label:s[3],den_label:s[4],multiplier:s[5],unit:s[6],direction:s[7]})));if(error)return alert(error.message);out()}
async function out(){[A.I,A.O]=await Promise.all([all(()=>sb.from('outcome_indicators').select('*').eq('active',true).order('code')),all(()=>sb.from('outcome_data').select('*').order('month'))]);A.ot=A.ot||'an';drawO()}
function drawO(){const T=[['an','Analysis'],['en','Data entry'],['in','Indicators']];
  $('main').innerHTML=`<div class="card"><div class="row">${T.map(t=>`<button class="${A.ot==t[0]?'':'g'}" onclick="A.ot='${t[0]}';drawO()">${t[1]}</button>`).join('')}</div>${A.I.length?'':`<p>No indicators defined yet. ${core()?'<button onclick="seedI()">Load standard Area H indicators</button>':'Ask the Core Committee to set them up.'}</p>`}</div><div id="oc"></div>`;
  if(A.I.length)({an:oAn,en:oEn,in:oIn}[A.ot])()}
const ok=(i,v)=>i.target==null||v==null?null:(i.direction=='higher'?v>=+i.target:v<=+i.target);
const okTag=o=>o==null?'–':o?'<span class="tag" style="background:#e6f4ea;color:#137333">Met</span>':'<span class="tag" style="background:#fce8e6;color:#c5221f">Not met</span>';
function ser(i,dp,f,t){const m={};A.O.filter(r=>r.indicator_id==i.id&&(!dp||r.dept_id==dp)&&r.month.slice(0,7)>=f&&r.month.slice(0,7)<=t).forEach(r=>{const k=r.month.slice(0,7);m[k]=m[k]||{n:0,d:0};m[k].n+=+r.numerator;m[k].d+=+r.denominator});return Object.keys(m).sort().map(k=>({k,n:m[k].n,d:m[k].d,v:m[k].d?m[k].n/m[k].d*i.multiplier:null}))}
function trd(s,i){const v=s.filter(x=>x.v!=null).map(x=>x.v);if(v.length<2)return null;const k=Math.min(3,Math.floor(v.length/2)),m=x=>x.reduce((p,q)=>p+q,0)/x.length,df=m(v.slice(-k))-m(v.slice(-2*k,-k));return Math.abs(df)<1e-9?{t:'Stable'}:{t:(df>0)==(i.direction=='higher')?'Improving':'Worsening'}}
function chart(s,i){const p=s.filter(x=>x.v!=null);if(!p.length)return'<p class="sm">No data in the selected period.</p>';
  const W=640,H=220,L=48,B=28,T=14,R=16,tg=i.target!=null?[+i.target]:[],vs=p.map(x=>x.v).concat(tg);let mn=Math.min(...vs),mx=Math.max(...vs);if(mn==mx){mn-=1;mx+=1}const pd=(mx-mn)*.12;mn-=pd;mx+=pd;
  const X=k=>L+(W-L-R)*(p.length>1?k/(p.length-1):.5),Y=v=>T+(H-T-B)*(1-(v-mn)/(mx-mn));
  const grid=[0,1,2,3].map(g=>{const v=mn+(mx-mn)*g/3;return`<line x1="${L}" x2="${W-R}" y1="${Y(v)}" y2="${Y(v)}" stroke="#e8eaed"/><text x="${L-6}" y="${Y(v)+4}" font-size="11" text-anchor="end" fill="#5f6368">${fx(v)}</text>`}).join('');
  return`<svg viewBox="0 0 ${W} ${H}" style="width:100%;max-width:720px">${grid}${tg.length?`<line x1="${L}" x2="${W-R}" y1="${Y(tg[0])}" y2="${Y(tg[0])}" stroke="#d93025" stroke-dasharray="6 4"/><text x="${W-R}" y="${Y(tg[0])-4}" font-size="11" text-anchor="end" fill="#d93025">Target ${tg[0]}</text>`:''}<polyline fill="none" stroke="#0b57d0" stroke-width="2.5" points="${p.map((x,k)=>X(k)+','+Y(x.v)).join(' ')}"/>${p.map((x,k)=>`<circle cx="${X(k)}" cy="${Y(x.v)}" r="4" fill="#0b57d0"/>${p.length<=12||k%2==0?`<text x="${X(k)}" y="${H-8}" font-size="11" text-anchor="middle" fill="#5f6368">${mlb(x.k)}</text>`:''}`).join('')}</svg>`}
function oAn(){
  const I=A.I.find(x=>x.id==A.ai)||A.I[0];A.ai=I.id;const d0=new Date();d0.setDate(1);d0.setMonth(d0.getMonth()-11);
  A.ad=A.ad||'';A.af=A.af||d0.toISOString().slice(0,7);A.at2=A.at2||today().slice(0,7);
  const dp=A.ad,f=A.af,t=A.at2,s=ser(I,dp,f,t),vs=s.filter(x=>x.v!=null),last=vs[vs.length-1],avg=vs.length?vs.reduce((p,q)=>p+q.v,0)/vs.length:null,tr=trd(s,I),mt=vs.filter(x=>ok(I,x.v)).length,sub=(dp?h(dn(dp)):'All departments combined')+' | '+mlb(f)+' to '+mlb(t);
  const ov=A.I.map(i=>{const q=ser(i,dp,f,t).filter(x=>x.v!=null),l=q[q.length-1],r=trd(q,i);return`<tr class="click" onclick="A.ai=${i.id};oAn()"><td>${h(i.code)}</td><td>${h(i.name)}</td><td>${l?fx(l.v)+' '+h(i.unit):'–'}</td><td>${i.target??'–'}</td><td>${l?okTag(ok(i,l.v)):'–'}</td><td>${r?r.t:'–'}</td></tr>`}).join('');
  const cmp=!dp&&last?depts.filter(d=>d.active).concat([{id:'ALL',name:'Hospital-wide'}]).map(d=>{const r=A.O.find(x=>x.indicator_id==I.id&&x.dept_id==d.id&&x.month.slice(0,7)==last.k),v=r&&+r.denominator?r.numerator/r.denominator*I.multiplier:null;return v==null?'':`<tr><td>${h(d.name)}</td><td>${fx(v)}</td><td>${okTag(ok(I,v))}</td></tr>`}).join(''):'';
  const nar=last?`<b>${h(I.name)}</b> (${sub}): latest value ${fx(last.v)} ${h(I.unit)} in ${mlb(last.k)}; average ${fx(avg)} over ${vs.length} month(s); trend ${tr?tr.t.toLowerCase():'cannot be assessed (needs at least 2 months)'}. ${I.target!=null?`Target ${I.target} ${h(I.unit)} (${I.direction=='higher'?'higher is better':'lower is better'}) was met in ${mt} of ${vs.length} month(s).${ok(I,last.v)===false?' The latest value is off target – root-cause analysis and a corrective-action entry in Gaps &amp; Actions is advised.':''}`:'No target is set for this indicator.'}`:'No data entered for the selected period.';
  $('oc').innerHTML=`<div class="card"><div class="row"><select onchange="A.ai=this.value;oAn()">${A.I.map(i=>`<option value="${i.id}" ${i.id==I.id?'selected':''}>${h(i.code)} – ${h(i.name)}</option>`).join('')}</select><select onchange="A.ad=this.value;oAn()"><option value="">All departments</option>${mine().map(d=>`<option value="${d.id}" ${d.id==dp?'selected':''}>${h(d.name)}</option>`).join('')}</select>From <input type="month" value="${f}" onchange="A.af=this.value;oAn()"> To <input type="month" value="${t}" onchange="A.at2=this.value;oAn()"><button class="g" onclick="print()">Print</button></div>
  ${ph('Outcome (Area H) Analysis',sub)}
  <div class="row"><span class="chip">Latest: <b>${last?fx(last.v)+' '+h(I.unit):'–'}</b></span><span class="chip">Average: <b>${fx(avg)}</b></span><span class="chip">Target: <b>${I.target??'–'}</b> ${okTag(last?ok(I,last.v):null)}</span><span class="chip">Trend: <b>${tr?tr.t:'–'}</b></span></div>
  ${chart(s,I)}
  <div class="wrap"><table><tr><th>Month</th><th>${h(I.num_label)}</th><th>${h(I.den_label)}</th><th>Value (${h(I.unit)})</th><th>vs Target</th></tr>${s.map(x=>`<tr><td>${mlb(x.k)}</td><td>${fx(x.n)}</td><td>${fx(x.d)}</td><td><b>${fx(x.v)}</b></td><td>${okTag(ok(I,x.v))}</td></tr>`).join('')}</table></div>
  <h3 style="margin-top:16px">Analysis & inference</h3><p>${nar}</p>
  ${cmp?`<h3>Department comparison – ${mlb(last.k)}</h3><div class="wrap"><table><tr><th>Department</th><th>Value</th><th>vs Target</th></tr>${cmp}</table></div>`:''}
  <h3 style="margin-top:16px">All Area H indicators – latest status</h3><div class="wrap"><table><tr><th>Code</th><th>Indicator</th><th>Latest</th><th>Target</th><th>Status</th><th>Trend</th></tr>${ov}</table></div><p class="sm np">Click an indicator row to analyse it.</p>${sig()}</div>`}
function oEn(){const D=core()?[['ALL','Hospital-wide'],...depts.filter(d=>d.active).map(d=>[d.id,d.name])]:mine().map(d=>[d.id,d.name]);A.od2=A.od2||D[0][0];A.om=A.om||today().slice(0,7);
  $('oc').innerHTML=`<div class="card wrap"><div class="row"><select onchange="A.od2=this.value;oEn()">${D.map(d=>`<option value="${d[0]}" ${d[0]==A.od2?'selected':''}>${h(d[1])}</option>`).join('')}</select><input type="month" value="${A.om}" onchange="A.om=this.value;oEn()"><button onclick="saveO()">Save all</button></div>
  <table><tr><th>Indicator</th><th>Numerator</th><th>Denominator</th><th>Value</th></tr>${A.I.map(i=>{const r=A.O.find(x=>x.indicator_id==i.id&&x.dept_id==A.od2&&x.month.slice(0,7)==A.om)||{};return`<tr data-i="${i.id}" data-m="${i.multiplier}"><td><b>${h(i.name)}</b><div class="sm">${h(i.standard)}</div></td><td><input type="number" step="any" class="en" value="${r.numerator??''}" oninput="calcO(this.closest('tr'))"><div class="sm">${h(i.num_label)}</div></td><td><input type="number" step="any" class="ed" value="${r.denominator??''}" oninput="calcO(this.closest('tr'))"><div class="sm">${h(i.den_label)}</div></td><td class="ev"></td></tr>`}).join('')}</table></div>`;
  document.querySelectorAll('#oc tr[data-i]').forEach(calcO)}
function calcO(tr){const n=tr.querySelector('.en').value,d=tr.querySelector('.ed').value;tr.querySelector('.ev').textContent=n!==''&&+d>0?fx(n/d*tr.dataset.m):'–'}
async function saveO(){const rows=[...document.querySelectorAll('#oc tr[data-i]')].map(tr=>({indicator_id:+tr.dataset.i,dept_id:String(A.od2),month:A.om+'-01',numerator:tr.querySelector('.en').value,denominator:tr.querySelector('.ed').value})).filter(r=>r.numerator!==''&&r.denominator!=='');
  if(!rows.length)return alert('Nothing to save');if(rows.some(r=>!(+r.denominator>0)))return alert('Denominator must be greater than 0');
  rows.forEach(r=>{r.numerator=+r.numerator;r.denominator=+r.denominator;r.entered_by=me.full_name||me.email;r.updated_at=new Date().toISOString()});
  const{error}=await sb.from('outcome_data').upsert(rows,{onConflict:'indicator_id,dept_id,month'});if(error)return alert(error.message);alert('Saved '+rows.length+' indicator(s)');out()}
function oIn(){const c=core();$('oc').innerHTML=`<div class="card wrap"><table><tr><th>Code</th><th>Indicator</th><th>Standard</th><th>Formula</th><th>Better</th><th>Target</th><th></th></tr>${A.I.map(i=>`<tr data-i="${i.id}"><td>${h(i.code)}</td><td>${h(i.name)}</td><td>${h(i.standard)}</td><td class="sm">(${h(i.num_label)} ÷ ${h(i.den_label)}) × ${i.multiplier} ${h(i.unit)}</td><td><select class="id" ${c?'':'disabled'}>${opts(['higher','lower'],i.direction)}</select></td><td><input class="it" type="number" step="any" value="${i.target??''}" ${c?'':'disabled'} style="width:90px"></td><td>${c?'<button class="g" onclick="saveI(this.closest(\'tr\'))">Save</button>':''}</td></tr>`).join('')}</table><p class="sm">Set targets as per the NQAS checklist / state benchmark.</p></div>`}
async function saveI(tr){const t=tr.querySelector('.it').value,{error}=await sb.from('outcome_indicators').update({direction:tr.querySelector('.id').value,target:t===''?null:+t}).eq('id',tr.dataset.i);if(error)return alert(error.message);out()}

boot();
</script></body></html>
