  <h3 style="margin-top:16px">All Area H indicators – latest status</h3><div class="wrap"><table><tr><th>Code</th><th>Indicator</th><th>Latest</th><th>Target</th><th>Status</th><th>Trend</th></tr>${ov}</table></div><p class="sm np">Click an indicator row to analyse it.</p>${sig()}</div>`}
function oEn(){const D=core()?[['ALL','Hospital-wide'],...depts.filter(d=>d.active).map(d=>[d.id,d.name])]:mine().map(d=>[d.id,d.name]);A.od2=A.od2||D[0][0];A.om=A.om||today().slice(0,7);
  $('oc').innerHTML=`<div class="card wrap"><div class="row"><select onchange="A.od2=this.value;oEn()">${D.map(d=>`<option value="${d[0]}" ${d[0]==A.od2?'selected':''}>${h(d[1])}</option>`).join('')}</select><input type="month" value="${A.om}" onchange="A.om=this.value;oEn()"><button onclick="saveO()">Save all</button></div>
  <table><tr><th>Indicator</th><th>Numerator</th><th>Denominator</th><th>Value</th></tr>${A.I.map(i=>{const r=A.O.find(x=>x.indicator_id==i.id&&x.dept_id==A.od2&&x.month.slice(0,7)==A.om)||{};return`<tr data-i="${i.id}" data-m="${i.multiplier}"><td><b>${h(i.name)}</b><div class="sm">${h(i.standard)}</div></td><td><input type="number" step="any" class="en" value="${r.numerator??''}" oninput="calcO(this.closest('tr'))"><div class="sm">${h(i.num_label)}</div></td><td><input type="number" step="any" class="ed" value="${r.denominator??''}" oninput="calcO(this.closest('tr'))"><div class="sm">${h(i.den_label)}</div></td><td class="ev"></td></tr>`}).join('')}</table></div>`;
  document.querySelectorAll('#oc tr[data-i]').forEach(calcO)}
function calcO(tr){const n=tr.querySelector('.en').value,d=tr.querySelector('.ed').value;tr.querySelector('.ev').textContent=n!==''&&+d>0?fx(n/d*tr.dataset.m):'–'}
async function saveO(){const rows=[...document.querySelectorAll('#oc tr[data-i]')].map(tr=>({indicator_id:+tr.dataset.i,dept_id:String(A.od2),month:A.om+'-01',numerator:tr.querySelector('.en').value,denominator:tr.querySelector('.ed').value})).filter(r=>r.numerator!==''&&r.denominator!=='');
  if(!rows.length)return alert('Nothing to save');if(rows.some(r=>!(+r.denominator>0)))return alert('Denominator must be greater than 0');
  rows.forEach(r=>{r.numerator=+r.numerator;r.denominator=+r.denominator;r.entered_by=me.full_name||me.email;r.updated_at=new Date().toISOString()});
  const{error}=await sb.from('outcome_data').upsert(rows,{onConflict:'indicator_id,dept_id,month'});if(error)return alert(error.message);alert('Saved '+rows.length+' indicator(s)');out()}
function oIn(){const c=core();$('oc').innerHTML=`<div class="card wrap"><table><tr><th>Code</th><th>Indicator</th><th>Standard</th><th>Formula</th><th>Better</th><th>Target</th><th></th></tr>${A.I.map(i=>`<tr data-i="${i.id}"><td>${h(i.code)}</td><td>${h(i.name)}</td><td>${h(i.standard)}</td><td class="sm">(${h(i.num_label)} ÷ ${h(i.den_label)}) × ${i.multiplier} ${h(i.unit)}</td><td><select class="id" ${c?'':'disabled'}>${opts(['higher','lower'],i.direction)}</select></td><td><input class="it" type="number" step="any" value="${i.target??''}" ${c?'':'disabled'} style="width:90px"></td><td>${c?'<button class="g" onclick="saveI(this.closest(\'tr\'))">Save</button>':''}</td></tr>`).join('')}</table><p class="sm">Set targets as per the NQAS checklist / state benchmark.</p></div>`}
async function saveI(tr){const t=tr.querySelector('.it').value,{error}=await sb.from('outcome_indicators').update({direction:tr.querySelector('.id').value,target:t===''?null:+t}).eq('id',tr.dataset.i);if(error)return alert(error.message);out()}

/* ===== Action plan report ===== */
async function runAP(d,f,to,sub){const V=vf(),G=(await all(()=>sb.from('gaps').select('*,checkpoints(me_ref,standard)').neq('stage','Improved').order('dept_id').order('id'))).filter(g=>V(g.dept_id)&&inD(g.dept_id,d)&&(!f||g.identified_on>=f)&&g.identified_on<=to);
  showR({pre:`<div class="ap">${phs('Action Plan for Gaps',sub)}`,tc:'aptb rpt',post:sig()+'</div>',th:`<tr><th>S. No.</th><th>Department</th><th>ME Ref. / Standard</th><th>Gap observed</th><th>Root cause</th><th>Corrective action</th><th>Preventive action</th><th>Resources</th><th>Responsible person</th><th>Timeline</th><th>Status</th></tr>`,rows:G.map((g,i)=>{const p=g.plan||{};return`<tr><td>${i+1}</td><td>${h(dn(g.dept_id))}</td><td>${h(g.checkpoints?.me_ref)}<div class="sm">${h(g.checkpoints?.standard)}</div></td><td>${h(g.description)}</td><td class="pw">${h(g.root_cause)}</td><td class="pw">${h(p.corrective)}</td><td class="pw">${h(p.preventive)}</td><td class="pw">${h(p.resources)}</td><td>${h(g.owner)}</td><td>${fd(g.target_date)}</td><td>${h(g.stage)}</td></tr>`})})}

/* ===== PDCA cycle documentation ===== */
const PD=[['plan','Plan','What & why','#1a73e8'],['do','Do','Implement','#188038'],['check','Check','Measure & verify','#f9ab00'],['act','Act','Standardise / improve','#d93025']],PS=['Plan','Do','Check','Act','Closed'];
const WHEEL=(()=>{const P=a=>{a*=Math.PI/180;return(50+40*Math.cos(a)).toFixed(1)+' '+(50+40*Math.sin(a)).toFixed(1)};return`<div class="pdc-w"><svg viewBox="0 0 100 100"><defs>${PD.map((s,i)=>`<marker id="mk${i}" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="2.4" markerHeight="2.4" orient="auto"><path d="M0 0L10 5L0 10z" fill="${s[3]}"/></marker>`).join('')}</defs><g class="spin">${PD.map((s,i)=>`<path d="M${P(i*90-80)} A40 40 0 0 1 ${P(i*90-20)}" fill="none" stroke="${s[3]}" stroke-width="5" stroke-linecap="round" marker-end="url(#mk${i})"/>`).join('')}</g></svg><b>PDCA</b></div>`})();
async function pdca(){A.P=await all(()=>sb.from('pdca_cycles').select('*').order('created_at',{ascending:false}));drawP()}
function drawP(c){c=c||{};
  $('main').innerHTML=`<div class="card"><h3>${c.id?'Edit':'New'} PDCA cycle</h3><div class="row"><input type="hidden" id="pi" value="${c.id||''}"><select id="pdp">${dopts(c.dept_id)}</select><input id="pt" size="40" placeholder="Title (quality problem / gap)" value="${h(c.title)}"><input id="pr" size="14" placeholder="Gap / ME ref" value="${h(c.ref)}"><input id="po" size="16" placeholder="Owner" value="${h(c.owner)}"><select id="ps">${opts(PS,c.status||'Plan')}</select></div>
  <textarea id="pp" rows="2" placeholder="Problem statement / aim">${h(c.problem)}</textarea>
  <div class="pdg">${WHEEL}${PD.map(s=>`<div class="pq" style="--c:${s[3]}"><div class="pqh"><span>${s[1][0]}</span>${s[1]} <small>${s[2]}</small><input type="date" id="${s[0]}d" value="${c[s[0]+'_date']||''}"></div><textarea id="${s[0]}t" rows="4" placeholder="${s[2]}…">${h(c[s[0]+'_txt'])}</textarea></div>`).join('')}</div>
  <div class="row"><button onclick="savePd()">Save</button><button class="g" onclick="pdca()">Clear</button></div></div>
  <div class="card wrap"><h3>PDCA cycles</h3><table><tr><th>Title</th><th>Department</th><th>Ref</th><th>Status</th><th>Owner</th><th></th></tr>${A.P.filter(x=>mine().some(d=>d.id==x.dept_id)).map(x=>`<tr><td>${h(x.title)}</td><td>${h(dn(x.dept_id))}</td><td>${h(x.ref)}</td><td><span class="tag">${h(x.status)}</span></td><td>${h(x.owner)}</td><td><button class="g" onclick="drawP(A.P.find(y=>y.id==${x.id}));scrollTo(0,0)">Edit</button> <button class="g" onclick="pdDoc(${x.id})">1-page print</button>${isAdmin()?` <button class="g r" onclick="delPd(${x.id})">Delete</button>`:''}</td></tr>`).join('')||'<tr><td colspan="6" class="sm">No cycles yet</td></tr>'}</table></div>`}
async function savePd(){const t=$('pt').value.trim();if(!t)return alert('Enter title');const o={dept_id:String($('pdp').value),ref:$('pr').value,title:t,problem:$('pp').value,owner:$('po').value,status:$('ps').value};PD.forEach(s=>{o[s[0]+'_txt']=$(s[0]+'t').value;o[s[0]+'_date']=$(s[0]+'d').value||null});const i=$('pi').value;
  if(!i)o.created_by=me.full_name||me.email;const{error}=i?await sb.from('pdca_cycles').update(o).eq('id',i):await sb.from('pdca_cycles').insert(o);if(error)return alert(error.message+'\nIf the table is missing, run migration.sql in Supabase.');pdca()}
async function delPd(id){if(!isAdmin())return alert('Only the admin login can delete PDCA cycles.');if(!confirm('Delete this PDCA cycle?'))return;const{error}=await sb.from('pdca_cycles').delete().eq('id',id);if(error)return alert(error.message);pdca()}
function pdDoc(id){const c=A.P.find(x=>x.id==id);
  $('mbox').innerHTML=`<div class="row np"><button onclick="pm()">Print (1 page)</button><button class="g" onclick="cm()">Close</button></div><div class="od pdp">${LH()}<div class="mm"><span>Ref: ${h(c.ref)}</span><span>Date: ${fd(today())}</span></div><div class="o1">PDCA CYCLE DOCUMENTATION</div><div class="o2">${h(c.title)}</div>
  <table style="width:100%;margin-bottom:6px"><tr><th>Department</th><td>${h(dn(c.dept_id))}</td><th>Owner</th><td>${h(c.owner)}</td><th>Status</th><td>${h(c.status)}</td></tr></table><p><b>Problem statement / aim:</b> ${h(c.problem)}</p>
  <div class="pdg">${WHEEL}${PD.map(s=>`<div class="pq" style="--c:${s[3]}"><div class="pqh"><span>${s[1][0]}</span>${s[1]} <small>${s[2]}</small>${fd(c[s[0]+'_date'])}</div><div class="pv">${h(c[s[0]+'_txt'])}</div></div>`).join('')}</div>${sig()}</div>`;
  $('modal').style.display='block'}

/* ===== Global auto-pagination: any long table in the page area is shown a page at a time (print shows everything) ===== */
(function(){
  const SKIP=/\b(dt|adt|gkt|rpt|apt|aptb|nopg)\b/,LIM=20;
  function setup(t){
    if(t.dataset.pgd)return;t.dataset.pgd=1;
    if(SKIP.test(t.className)||t.closest('.nopg,#modal,.dg,.pkl'))return;
    const rows=[...t.querySelectorAll(':scope>tr,:scope>tbody>tr')].filter(r=>r.parentElement.tagName!='THEAD');
    const isH=r=>r.querySelector('th'),isG=r=>{const c=r.children;return c.length==1&&+c[0].colSpan>1};
    const data=rows.filter(r=>!isH(r));if(data.length<=LIM)return;
    // units: a data row plus the group-header rows directly above it
    const U=[];let pend=[];data.forEach(r=>{if(isG(r)){pend.push(r);return}U.push([...pend,r]);pend=[]});if(pend.length)U.push(pend);
    const hs=data.slice(0,8).map(r=>r.offsetHeight).filter(Boolean),av=hs.length?hs.reduce((p,x)=>p+x,0)/hs.length:30;let ps=av>90?5:av>45?10:15,pg=1;const bar=document.createElement('div');bar.className='gkpg np';t.insertAdjacentElement('afterend',bar);
    const n=U.length;
    function draw(){
      const np=Math.max(1,Math.ceil(n/ps));pg=Math.min(pg,np);
      U.forEach((u,i)=>{const on=i>=(pg-1)*ps&&i<pg*ps;u.forEach(r=>on?r.removeAttribute('data-pgh'):r.setAttribute('data-pgh','1'))});
      bar.innerHTML=`<span class="sm">${(pg-1)*ps+1}–${Math.min(n,pg*ps)} of ${n}</span><span class="gkb"><button type="button" class="g" ${pg<2?'disabled':''} data-p="1">«</button><button type="button" class="g" ${pg<2?'disabled':''} data-p="${pg-1}">‹ Prev</button><span class="sm">Page <b>${pg}</b> of ${np}</span><button type="button" class="g" ${pg>=np?'disabled':''} data-p="${pg+1}">Next ›</button><button type="button" class="g" ${pg>=np?'disabled':''} data-p="${np}">»</button></span><span class="sm">Rows <select>${[5,10,15,25,50,100].map(x=>`<option ${x==ps?'selected':''}>${x}</option>`).join('')}</select></span>`;
    }
    bar.onclick=e=>{const b=e.target.closest('button[data-p]');if(!b||b.disabled)return;pg=+b.dataset.p;draw();t.scrollIntoView({block:'nearest'})};
    bar.onchange=e=>{if(e.target.tagName=='SELECT'){ps=+e.target.value;pg=1;draw()}};
    draw();
  }
  let q=0;const run=()=>{q=0;document.querySelectorAll('#main table').forEach(setup)};
  new MutationObserver(()=>{if(!q)q=requestAnimationFrame(run)}).observe(document.getElementById('main'),{childList:true,subtree:true});
})();
boot();
</script></body></html>
